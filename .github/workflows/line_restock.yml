name: Check restock

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          pip install playwright
          playwright install --with-deps chromium

      - name: Check stock
        env:
          PRODUCT_URL: ${{ secrets.PRODUCT_URL }}
          PRODUCT_KEYWORD: ${{ secrets.PRODUCT_KEYWORD }}
          SOLD_OUT_TEXT: ${{ secrets.SOLD_OUT_TEXT }}
          LINE_CHANNEL_ACCESS_TOKEN: ${{ secrets.LINE_CHANNEL_ACCESS_TOKEN }}
          LINE_USER_ID: ${{ secrets.LINE_USER_ID }}
        run: python check_stock.py

      - name: Save state
        run: |
          git config user.name "restock-bot"
          git config user.email "restock-bot@users.noreply.github.com"
          git add state.txt
          git diff --staged --quiet || (git commit -m "update state" && git push)
